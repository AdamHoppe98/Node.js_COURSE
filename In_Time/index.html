<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Time</title>
    <style>
        div {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 150px;
            
        }

        ul {
            list-style-type: none;
        }

        p {
            font-size: 26px;
        }

        input {
            padding: 12px;
            border: 1px solid black;
            border-radius: 7px;
            margin: 4px;
            font-size: 20px;
        }

        body {
            background-color: deepskyblue;
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif
        }

        button {
            margin: 10px;
            padding: 12px 50px;
            font-size: 20px;
            border-radius: 7px;
            border: 1px solid black;
            background: white;
        }

        button:hover {
            background: rgb(204, 204, 214);
            cursor: pointer;
            border: none;
        }

        label {
            font-size: 26px;
        }

        #createElement {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>

<body>

    <h1 id="clock">--:--:--</h1>
    <div id="center">

        <ul id="cities">

        </ul>

    </div>

    <div id="createElement">
        <label for="">City:</label>
        <input type="text" id="city"></input>
        <label for="">Time zone:</label>
        <input type="text" id="timeZone"></input>
        <button onclick="postCity()">opret</button>
        <p hidden id="error" style="color: red;"></p>
    </div>

    <script>
        updateClock().then(() => timeDifference());

        const formatOffset = (timeZone) => {
            if (timeZone === 0) return "same as you";
            return timeZone > 0 ? `${timeZone}h ahead` : `${Math.abs(timeZone)}h behind`;
        };
        async function updateClock() {
            const result = await fetch("/api/time").then(response => response.json());
            document.getElementById('clock').textContent = result.data.localString;
            return result;
        }
        const timeDifference = () => {
            const timeElementText = document.getElementById('clock').textContent;
            console.log(timeElementText);

        }

        async function postCity() {
            const city = document.getElementById("city").value
            const timeZone = document.getElementById("timeZone").value
            if (city.trim() === "" || timeZone.trim() === "") {
                const errorElement = document.getElementById("error");
                errorElement.hidden = false;
                errorElement.textContent = "City eller Time zone må ikke være tomme"
                city.textContent = ""
                timeZone.textContent = ""
                return;
            }
            if ( isNaN(timeZone)){
                const errorElement = document.getElementById("error");
                errorElement.hidden = false;
                errorElement.textContent = "Time Zone skal være et tal"
                city.textContent = ""
                timeZone.textContent = ""
                return;
            }
            console.log(city, timeZone);
            
            const errorElement = document.getElementById("error");
            errorElement.hidden = true;
            try {
                const res = await fetch('http://localhost:8080/api/cities', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: city.trim(), timeZone: timeZone.trim() })
                })
                if (!res.ok) {
                    console.log("der skete en fejl");
                    
                }
                city.textContent = ""
                timeZone.textContent = ""
                render()
            } catch {
                console.log("der skete en fejl")
            }

        }

        async function render() {
            const timeData = await fetch("/api/time")
                .then(response => response.json())
                .then(result => result.data);

            const now = new Date(timeData.iso);
            document.getElementById('clock').textContent = timeData.localString;

            const cities = await fetch("/api/cities")
                .then(response => response.json())
                .then(result => result.data);

            const citiesElement = document.getElementById("cities");
            citiesElement.textContent = "";

            cities.forEach(city => {
                const cityTime = new Date(now.getTime() + city.timeZone * 60 * 60 * 1000);

                const li = document.createElement("li");
                const timeElement = document.createElement("p");
                timeElement.textContent =
                    `${city.name}  |  ${cityTime.toLocaleTimeString('da-DK')}  |  ${formatOffset(city.timeZone)}`;

                li.appendChild(timeElement);
                citiesElement.appendChild(li);
            });
        }



        render();
        setInterval(render, 1000);


    </script>
</body>

</html>
